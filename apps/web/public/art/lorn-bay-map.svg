<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" fill="none">
  <title>Lorn Bay — a west-shore village on Okanagan Lake</title>
  <desc>North is up. The lake lies east of the village, with orchard benches and Highway 97 uphill to the west. A winding village road connects the Kettle, General, hall, and old wharf. A regional inset locates the fictional village between Peachland and Summerland.</desc>
